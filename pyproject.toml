# Declared so that `pip install .` and `pip install '.[test]'` are the only install steps
# the README gives. With no backend named, pip falls back to an implicit setuptools it
# fetches unasked, which then refuses this flat layout.
[build-system]
# 77 is the first setuptools to accept the SPDX `license` string in [project] (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-feeds"
version = "0.2.0"
description = "Feed adapters: public media RSS and a local music library in, the committed JSON records a site renders out"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
# One runtime package, for one tool: album_scan's folder source reads each track's ID3
# tags with mutagen, pinned to one exact release. The license was read from the package
# metadata when pinned: mutagen GPL-2.0-or-later. A license can change between versions,
# so re-read it on every bump. Everything else uses the standard library only: feed_read
# reads RSS with xml.etree and email.utils rather than taking a dependency.
dependencies = ["mutagen==1.48.1"]

[project.optional-dependencies]
# album_scan's Music.app sources (--source music and auto) need the apple-music-toolbox,
# which is not a package: clone apple-music-toolbox beside this repository, or point
# --toolbox or APPLE_MUSIC_TOOLBOX at a clone. This extra installs nothing; it is
# declared so the requirement has a name a reader can find, and README.md says how to
# meet it.
apple-music = []
# Everything the suites need. hypothesis drives the property tests and nothing at runtime
# imports it. mutagen is repeated here at the same pin, because the folder-source suites
# write ID3 tags with it, and a check that installs this extra's requirement strings on
# their own, before the project itself, would otherwise run them without it.
test = ["hypothesis==6.165.10", "mutagen==1.48.1"]

[tool.setuptools]
# Deliberately empty. Every tool is run directly and puts its own sibling folders on
# sys.path, so nothing here is imported from an installed location: installing this
# distribution installs its metadata and dependencies, never code. Left to
# auto-discovery, setuptools refuses this flat layout of sibling folders outright.
packages = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F are ruff's classic default set, written out so the enabled rules are a
# function of this file rather than of whichever ruff release is installed. PGH003/PGH004
# require every suppression to carry a rule code. D adds the docstring rules (pep257),
# minus D401's imperative-mood opinion, which rewords valid noun-phrase summaries.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004", "D"]
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names self-document; a docstring per test would be noise.
"**/test_*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Each CLI, and feed_read for bounded_fetch, puts these folders on sys.path at runtime,
# from the repository root (stdio_utf8/stdio_utf8.md, "How this project's tools import
# it"). mypy cannot see a runtime insert, so they are named here for it.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/stdio_utf8",
  "$MYPY_CONFIG_FILE_DIR/help_formatter",
  "$MYPY_CONFIG_FILE_DIR/bounded_fetch",
  "$MYPY_CONFIG_FILE_DIR/feed_read",
  "$MYPY_CONFIG_FILE_DIR/wikidata_director",
  # album_scan reaches cover_art as a sibling, and cover_art.py puts its private src/ on
  # sys.path at runtime, so `import artwork_match` needs its own entry.
  "$MYPY_CONFIG_FILE_DIR/cover_art",
  "$MYPY_CONFIG_FILE_DIR/cover_art/src",
  "$MYPY_CONFIG_FILE_DIR/library_walk",
  # cover_art's cold-cache test runs its child through bounded_run, and bounded_run.py
  # puts its private src/ on sys.path at load time, which mypy cannot see either.
  "$MYPY_CONFIG_FILE_DIR/bounded_run",
  "$MYPY_CONFIG_FILE_DIR/bounded_run/src",
  "$MYPY_CONFIG_FILE_DIR/live_pid_guard",
]

[tool.gate_cache]
# The environment variables this project's code reads by name. No tool here reads this
# table; feed_read/tests/test_feed_read_env_declared.py does, and fails when the list and
# the environment reads it finds in the tools' source (by literal or module-level
# constant) differ, so the list stays a true inventory. Each *_OFFLINE switch skips its
# tool's live test, and each identity variable skips it when absent. BOOK_SCAN_KEY and
# FILM_SCAN_TMDB_TOKEN are credentials read only by their tool's CLI. BOOK_SCAN_SOURCE
# and BOOK_SCAN_CSV_DIR choose which source book_scan reads. APPLE_MUSIC_TOOLBOX names
# the toolbox album_scan imports for a Music.app source.
env = [
  "ALBUM_SCAN_OFFLINE",
  "APPLE_MUSIC_TOOLBOX",
  "BOOK_SCAN_CSV_DIR",
  "BOOK_SCAN_KEY",
  "BOOK_SCAN_OFFLINE",
  "BOOK_SCAN_SOURCE",
  "BOOK_SCAN_USER_ID",
  "COVER_ART_OFFLINE",
  "FILM_SCAN_OFFLINE",
  "FILM_SCAN_TMDB_TOKEN",
  "FILM_SCAN_USERNAME",
  "WIKIDATA_DIRECTOR_OFFLINE",
]
